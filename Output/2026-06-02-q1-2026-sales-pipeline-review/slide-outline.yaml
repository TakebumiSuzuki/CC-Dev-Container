      - Why did growth slow if the pipeline looks healthy? Q1 revenue came from 2025 wins; the pipeline closes in H2. Converting at current rates should re-accelerate Q3–Q4.
      - Is the NPS drop real or a data artifact? Small sample (28), but directional signal is real. Follow up all detractors within 30 days before concluding.
