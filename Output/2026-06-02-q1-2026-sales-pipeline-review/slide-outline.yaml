  - title: "Recommendations: Four Actions for H2"
    body: |
      1. **C-suite relationship investment** — partner presence at events for top 15 target accounts; counter McKinsey's board-level entry.
      2. **T&D win-rate program** — structured win/loss debriefs on all H2 T&D deals; diagnose proposal-stage vs. sourcing-stage loss.
      3. **NPS triage** — follow up all 16 detractors within 30 days; identify practice/AM concentration.
      4. **AI advisory build** — plan 4–5 net-new hires in Q2 to capture H2 demand (~$3–4M).
    suggested_layout: "Bullet list: 4 numbered items stacked vertically with bold lead phrases"
    speaker_notes: |
      Priorities are interdependent: NPS triage protects the 68% repeat-client revenue base; T&D win-rate program addresses the largest single upside lever; C-suite relationship investment is a 6–18 month play to close structural loss gap; AI advisory hire decision needs to be made in Q2 to hit H2 demand windows.

