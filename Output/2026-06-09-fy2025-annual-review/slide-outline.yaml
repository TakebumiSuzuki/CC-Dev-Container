          - ["Operations Excellence", 3.9, "29.8%"]
          - ["Overall", 4.15, "30.6%"]
    speaker_notes: |
      Root causes for late delivery: (1) mid-engagement scope expansion without timely amendments (Triumph pattern), (2) client-side sponsor instability (Empire pattern). Fix: tighter SOW scope gates on transformation engagements.

