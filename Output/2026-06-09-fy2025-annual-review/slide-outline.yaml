  - title: "Project Outcomes"
    body: |
      31 projects completed. On-time delivery at 54.8% is the firm's primary operational gap.
      Average client satisfaction 4.15/5.0. Notable win: Apex Financial ($1.1M, 2 weeks early, 34% margin).
      Delivery issues: Triumph Automotive (6 weeks late) and Empire Retail (partial deliverable).

      {{project_outcomes}}
    suggested_layout: "Table placed large in the center of the slide"
    data:
      project_outcomes:
        type: table
        source: "./Data/projects/completed_projects.csv"
