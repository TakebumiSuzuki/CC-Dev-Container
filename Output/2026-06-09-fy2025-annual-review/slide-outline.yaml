      Anticipated questions:

      Q: Why did on-time delivery fall to 54.8%?
      A: Two root causes — mid-engagement scope expansion without timely amendments (Triumph Automotive pattern) and client-side sponsor instability (Empire Retail pattern). Fix is tighter SOW scope gates on transformation engagements.

      Q: If we're losing on relationships, not quality, what's the fix?
      A: Deepen existing accounts before chasing new logos — 68% of revenue already comes from repeat clients, and relationship is the primary win predictor in our own data.
