    body: |
      Win rate 29% (7/24 deals) — below the 33% industry average for competitive RFPs.
      Relationship gap drove 8 of 17 losses. Primary competitors: Deloitte, BCG, Accenture, Oliver Wyman.
      Win drivers: prior relationship (4 of 7 wins), innovation, expertise, price.

      {{win_loss}}
    suggested_layout: "Table placed large in the center of the slide"
