  - title: "Thank You"
    body: |
      Questions & Discussion
    suggested_layout: "Title Slide: Large centered title, with 'Questions & Discussion' in smaller text below"
    speaker_notes: |
      Anticipated Q&A:

      Q: Revenue grew 13% but on-time delivery fell to 55% — are these connected?
      A: Partially. Rapid growth can stretch delivery teams, but the specific root causes identified — inadequate scope gates (Triumph Automotive) and volatile client-side sponsorship (Empire Retail) — are process failures rather than pure capacity failures. The fix is structural, not just hiring.

      Q: Why is NPS flat despite strong retention and revenue growth?
      A: Retention measures whether clients renew; NPS measures how they feel about the relationship. A client can renew out of switching costs or inertia without becoming a promoter. The divergence signals that revenue metrics are healthy but relationship depth is not deepening at the same rate.

      Q: What is the risk on the six at-risk active projects?
      A: The six at-risk projects represent approximately 10% of the active portfolio by count. Individual account reviews are recommended at the next QBR to assess remediation options before any move toward partial delivery or early termination.

      Q: Is the Technology & Digital capacity constraint impacting FY2025 results, or is it purely a forward risk?
      A: The over-capacity situation was flagged as of April 2026 (Q1 2026 observation) and did not depress FY2025 results. It is a forward constraint: the $6.2M weighted sales pipeline cannot convert to revenue at full efficiency without additional headcount.

      Q: What was the total revenue impact of the Triumph Automotive and Empire Retail issues?
      A: Empire Retail invoiced $320K of a $500K contract — a $180K shortfall. Triumph Automotive's scope amendment was eventually processed, so the primary impact was a Q3 cash flow timing gap, not lost revenue. Combined leakage is estimated at ~$180K against $43.7M firm total — immaterial to the top line, but meaningful as a leading indicator of delivery risk.
