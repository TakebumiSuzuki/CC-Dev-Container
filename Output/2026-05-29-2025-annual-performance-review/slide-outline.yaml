  - title: "Strategic Priorities for FY2026"
    body: |
      1. **Restore delivery consistency.** On-time rate fell to 54.8%. Implement firm-wide SOW standard with explicit scope gates and sponsor-change escalation clauses.

      2. **Convert NPS detractors.** 45% of clients in the detractor band. Targeted account recovery + improvements in consultant continuity and action plan delivery.

      3. **Resolve T&D capacity.** Highest pipeline ($6.2M), largest revenue share (28%), over-capacity now. Approve two Senior Consultant hires.
    suggested_layout: "Bullet list: 3 numbered items with bold headers and 2-line descriptions each"
    speaker_notes: |
      These three priorities are sequenced intentionally: delivery consistency is the most urgent (internal process fix, no external dependency), detractor conversion is medium-term (requires account ownership and behavioral change), and T&D capacity is a near-term hiring decision the Partners can take in this session.

