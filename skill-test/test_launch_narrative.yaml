---
title: "新機能「自動レポート生成」リリース振り返り"
author: "鈴木花子"
date: "2025-09-30"

slides:
  - title: "新機能「自動レポート生成」リリース振り返り"
    body: |
      プロダクト・開発合同レビュー会

      2025年9月30日 / 鈴木花子
    suggested_layout: "タイトルスライド: タイトルを中央に大きく、下に提出先と日付を小さめに"
    notes: |
      プロダクト・開発合同レビュー会向け。
      時間 20 分 + 質疑 10 分。
      採用率の高さと、パフォーマンス課題の両面を率直に共有する。

  - title: "本日のアジェンダ"
    body: |
      1. サマリー
      2. 採用状況
      3. ユーザーからのフィードバック
      4. 課題と次期対応
      5. チームの貢献
      6. まとめと次期計画
    suggested_layout: "番号付きリストを中央に大きめのフォントで縦に並べる"
    notes: |
      6 セクション、各 3 分目安。
      質疑は最後にまとめて受ける。

  - title: "サマリー"
    body: |
      - 2025/6/15 リリース、3ヶ月で予想を大きく上回る採用率を達成
      - エンタープライズの **62%** が利用、月次アクティブ率 **45%**
      - レポート作成時間が平均で **1/8** に短縮 (顧客フィードバック)
      - 一方、リリース後に **パフォーマンス問題が2回発生**、運用負担増が課題
    suggested_layout: "箇条書き: 4項目を大きめのフォントで縦に。太字部分を強調"
    notes: |
      成果と課題の両面を冒頭で提示。
      パフォーマンス問題は隠さず正面から触れる。
      詳細は以降のセクションで掘り下げる。

  - title: "セグメント別の採用率"
    body: |
      エンタープライズが牽引。SMBは機能の複雑度が要因で低位に留まる。

      {{adoption_table}}
    suggested_layout: "上にコメント1行、下に表を中央配置。エンタープライズ行をハイライト"
    data:
      adoption_table:
        type: table
        headers: ["顧客セグメント", "採用率", "月次アクティブ率"]
        rows:
          - ["エンタープライズ", "62%", "45%"]
          - ["ミッドマーケット", "34%", "21%"]
          - ["SMB", "18%", "9%"]
    notes: |
      セグメントごとに採用速度の差が明確に出ている。
      SMBの低さは機能の複雑度が要因と分析。SMB向け簡易版を検討中。

  - title: "週次アクティブユーザー数の推移"
    body: |
      8月第2週からの急上昇は、ドキュメント刷新の効果と分析。

      {{wau_chart}}
    suggested_layout: "上にコメント1行、下に折れ線グラフを大きく中央配置"
    data:
      wau_chart:
        type: line_chart
        x_axis: "週"
        y_axis: "アクティブユーザー数"
        categories: ["6月3週", "6月4週", "7月1週", "7月2週", "7月3週", "7月4週", "8月1週", "8月2週", "8月3週", "8月4週", "9月1週", "9月2週", "9月3週", "9月4週"]
        series:
          - name: "週次アクティブユーザー数"
            values: [120, 145, 175, 188, 210, 225, 240, 380, 450, 520, 580, 640, 695, 740]
    notes: |
      リリース直後 (6月3週) の 120 から、9月4週には 740 まで成長。
      7月の機能改善 → 8月のドキュメント刷新が転換点。
      ドキュメント刷新の効果を、テクニカルライターの貢献として後段で再度言及する。

  - title: "ユーザーからのフィードバック"
    body: |
      - 本機能利用ユーザーの **NPS は +38** (全機能平均 +22 を大きく上回る)
      - 「レポート作成時間が **週8時間 → 週1時間**」など定性評価も高い
      - 一方、**約20%のユーザー**から「カスタマイズ性が物足りない」との指摘
    suggested_layout: "箇条書き: 3項目を大きめのフォントで縦に。太字部分を強調"
    notes: |
      定量 (NPS +38) と定性 (時間削減コメント) の両面で評価が高い。
      カスタマイズ性は次期バージョンの最優先課題として位置づける。

  - title: "課題と次期対応"
    body: |
      パフォーマンス問題は現在解消済み。根本改善のため次期バージョンでアーキテクチャ見直し計画中。

      {{issues_table}}
    suggested_layout: "上にコメント1行、下に表を中央配置。影響度「高」の行をハイライト"
    data:
      issues_table:
        type: table
        headers: ["課題", "影響度", "対応状況"]
        rows:
          - ["大規模データでの遅延", "高", "完了"]
          - ["メモリ使用量の想定外増加", "中", "対応中"]
          - ["カスタマイズ性不足の指摘", "中", "計画中"]
          - ["細かなUI不具合 (15件)", "低", "順次対応"]
    notes: |
      パフォーマンス問題は2回の障害を引き起こし、運用チームに大きな負担をかけた。
      現在は解消済みだが、アーキテクチャ見直しは次期バージョンの最優先事項。
      想定見積もり不足が根本原因という認識。

  - title: "チームの貢献"
    body: |
      開発・QA・ドキュメント・カスタマーサクセスの連携で実現。特に8月のドキュメント刷新がターニングポイント。

      {{team_photo}}
    suggested_layout: "中央に大きく画像、上に1行コメント"
    data:
      team_photo:
        type: image
        path: "./images/launch_team.jpg"
        caption: "リリース当日のチーム写真"
        alt_text: "リリース当日に撮影したチーム集合写真"
    notes: |
      テクニカルライターチームのドキュメント刷新が、採用率急上昇 (8月第2週) のターニングポイント。
      開発・QA・ドキュメント・CS それぞれの貢献に直接言及。

  - title: "まとめと次期計画"
    body: ""
    suggested_layout: "セクション扉: タイトルのみを中央に大きく表示"
    notes: |
      最後のまとめパートに入る合図。

  - title: "総括と次期方針"
    body: |
      - 「自動レポート生成」は **2025年最大の成功事例の一つ**
      - 次期リリースの最優先は **カスタマイズ性向上** と **アーキテクチャ移行**
      - 採用拡大とパフォーマンス両立に向けて、引き続き各チーム連携で推進
    suggested_layout: "箇条書き: 3項目を大きめのフォントで縦に。太字を強調"
    notes: |
      3点に絞ってクロージング。
      カスタマイズ性は Q4 で要件定義、Q1 リリース予定。
      質疑時間 (10分) を確保すること。

  - title: "ご清聴ありがとうございました"
    body: |
      質疑応答
    suggested_layout: "クロージング: 中央に大きく感謝メッセージ、下に「質疑応答」を控えめに"
    notes: |
      想定質問と回答方針:
      - SMB採用率の低さ → 機能の複雑度が要因。SMB向け簡易版を検討中
      - パフォーマンス問題の根本原因 → アーキテクチャ設計時の想定見積もり不足
      - カスタマイズ性向上の優先度 → Q4で要件定義、Q1リリース予定
